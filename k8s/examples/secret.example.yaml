# TEMPLATE ONLY. Do not put a real key in this file and do not apply it as is.
# A Secret is like a ConfigMap for sensitive values. Create the real one from your shell
# environment instead, so the key never touches a file or git:
#
#   kubectl -n attack-graph create secret generic attack-graph-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
# Note: Secret values are only base64-encoded, not encrypted, unless the cluster encrypts
# them at rest. Anyone allowed to read Secrets in the namespace can read the key.
apiVersion: v1
kind: Secret
metadata:
  name: attack-graph-secrets
  namespace: attack-graph
type: Opaque
stringData:
  # checkov:skip=CKV_SECRET_6: placeholder text, not a key
  ANTHROPIC_API_KEY: replace-me-with-your-key-via-the-command-above
